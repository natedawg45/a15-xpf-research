name: XPF - A15 iOS 18.6.2 research

on:
  workflow_dispatch:
    inputs:
      analyze_kernel:
        description: "Download iPhone14,3 build 22G100 kernelcache and run XPF (disable to test compilation only)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  analyze:
    name: Build XPF and inspect iPhone14,3 kernelcache
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Clone upstream XPF with dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/opa334/XPF.git XPF
          git -C XPF rev-parse HEAD | tee logs/xpf-commit.txt
          git -C XPF submodule status | tee logs/submodules.txt

      - name: Compile original XPF macOS command-line tool
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          # Adapt only the test CLI: preserve the upstream patchfinder library unchanged.
          # Running sets independently prevents one unsupported finder from aborting the scan.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("XPF/src/cli/main.c")
          src = p.read_text()
          src = src.replace("#include <time.h>", "#include <time.h>\n#include <stdlib.h>", 1)
          first = src.index("char *sets[] = {")
          last = src.index("xpc_object_t serializedSystemInfo", first)
          replacement = (
              'const char *requestedSet = getenv("XPF_RESEARCH_SET");\n'
              '\t\t\t\tif (!requestedSet || !*requestedSet) requestedSet = "struct";\n'
              '\t\t\t\tchar *sets[] = {(char *)requestedSet, NULL};\n'
              '\t\t\t\tprintf("Requested analysis set: %s\\n", requestedSet);\n'
              '\t\t\t\t'
          )
          p.write_text(src[:first] + replacement + src[last:])
          print("CLI adapted for individual analysis sets.")
          PY
          (cd XPF && make output/macos/libxpf.dylib output/macos/xpf_test) 2>&1 | tee logs/xpf-build.log
          file XPF/output/macos/xpf_test XPF/output/macos/libxpf.dylib
          test -x XPF/output/macos/xpf_test

      - name: Install IPSW for remote kernelcache extraction
        if: ${{ inputs.analyze_kernel }}
        shell: bash
        run: brew install ipsw

      - name: Download Apple kernelcache and SPTM/TXM firmware
        if: ${{ inputs.analyze_kernel }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kerneldata
          cd kerneldata
          ipsw download ipsw --device iPhone14,3 --build 22G100 --kernel --confirm 2>&1 | tee ../logs/ipsw-download.log
          echo "Downloaded candidate files:"
          find . -maxdepth 6 -type f -print | head -80
          RAW="$(find . -type f \( -name 'kernelcache.release.*' -o -name 'kernelcache' \) ! -name '*.decompressed' -print -quit)"
          if [ -z "$RAW" ]; then
            echo "No kernelcache file found after remote extraction."
            exit 1
          fi
          echo "Selected input: $RAW"
          file "$RAW"
          # The remote IPSW extractor may already provide a decoded Mach-O kernelcache.
          # Decompress only when we receive an IM4P container.
          if file "$RAW" | grep -q 'Mach-O'; then
            KERNEL="$(cd "$(dirname "$RAW")" && pwd)/$(basename "$RAW")"
            echo "IPSW provided an already-decoded Mach-O; skipping decompression."
          else
            ipsw kernel dec "$RAW" -o "$PWD/unpacked" 2>&1 | tee ../logs/ipsw-decompress.log
            KERNEL="$(find "$PWD/unpacked" -type f -name '*.decompressed' -print -quit)"
            if [ -z "$KERNEL" ]; then
              echo "Could not find decompressed Mach-O kernelcache."
              exit 1
            fi
          fi
          file "$KERNEL"
          echo "KERNEL_PATH=$KERNEL" >> "$GITHUB_ENV"

          # Retrieve the matching, publicly distributed SPTM and TXM firmware.
          # XPF expects these original IMG4-format files as optional arguments.
          ipsw download ipsw --device iPhone14,3 --build 22G100 --pattern 'sptm\.t8110\.release|txm\.iphoneos\.release' --confirm 2>&1 | tee ../logs/ipsw-sptm-txm.log
          SPTM="$(find "$PWD" -type f -name 'sptm.t8110.release' -print -quit)"
          TXM="$(find "$PWD" -type f -name 'txm.iphoneos.release' -print -quit)"
          if [ -z "$SPTM" ] || [ -z "$TXM" ]; then
            echo "SPTM or TXM file missing after remote extraction."
            find . -type f -print
            exit 1
          fi
          echo "SPTM selected: $SPTM"
          echo "TXM selected: $TXM"
          file "$SPTM" "$TXM"
          echo "SPTM_PATH=$SPTM" >> "$GITHUB_ENV"
          echo "TXM_PATH=$TXM" >> "$GITHUB_ENV"

      - name: Test XPF analysis sets independently
        if: ${{ inputs.analyze_kernel }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Analyzing Apple iPhone14,3 iOS 18.6.2 (22G100)."
          echo "Each category runs independently; errors are preserved in its own log."
          {
            echo "### XPF analysis: iPhone14,3 / iOS 18.6.2 (22G100)"
            echo ""
            echo "| Analysis set | Result | Values reported |"
            echo "| --- | --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          success=0
          for set in translation trustcache physmap struct physrw IOSurface sandbox perfkrw devmode badRecovery arm64kcall trigon; do
            echo "=== SET: $set ==="
            exitcode=0
            XPF_RESEARCH_SET="$set" XPF/output/macos/xpf_test "$KERNEL_PATH" "$SPTM_PATH" "$TXM_PATH" > "logs/xpf-$set.log" 2>&1 || exitcode=$?
            cat "logs/xpf-$set.log"
            if [ "$exitcode" -eq 0 ] && ! grep -qE 'Failed to start XPF|XPF Error:' "logs/xpf-$set.log"; then
              result="PASS"
              success=$((success + 1))
            else
              result="FAIL (see log)"
            fi
            count=$(grep -c '<-' "logs/xpf-$set.log" || true)
            echo "| $set | $result | $count |" >> "$GITHUB_STEP_SUMMARY"
            printf "%s %s values=%s\n" "$set" "$result" "$count" >> logs/set-results.txt
          done
          echo "Successful analysis sets: $success"
          if [ "$success" -eq 0 ]; then
            echo "No set completed successfully; inspect logs/xpf-*.log."
            exit 1
          fi

      - name: Upload logs (no firmware binaries)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: xpf-research-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14
